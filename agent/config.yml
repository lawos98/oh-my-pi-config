async:
  enabled: true
  maxJobs: 4
task:
  eager: preferred
  isolation:
    mode: rcopy
    merge: patch
  enableEffort: true
  batch: true
  maxRecursionDepth: 3
compaction:
  enabled: true
  midTurnEnabled: true
  methodOrder:
    - snapcompact
    - remote
    - soft
skills:
  enabled: true
providers:
  webSearchOrder:
    []
  memoryModel: online
modelRoles:
  default: openai-codex/gpt-5.6-sol
  smol: openai-codex/gpt-5.6-luna
  task: openai-codex/gpt-5.6-luna
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:xhigh
cycleOrder:
  - smol
  - default
  - slow
symbolPreset: unicode
composer:
  shape: box
theme:
  dark: titanium
setupVersion: 2
omitThinking: false
steeringMode: one-at-a-time
tools:
  approvalMode: yolo
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: true
edit:
  mode: hashline
security:
  enabled: true