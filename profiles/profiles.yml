# Single source for ohMyPi model settings, skills, and file commands.
# Every type receives global skill, command, and MCP server lists plus its own. Duplicates are removed.
defaults:
  model: luna
  type: backend

models:
  luna:
    modelRoles:
      default: "openai-codex/gpt-6-luna:auto"
      plan: "openai-codex/gpt-6-luna:max"
      slow: "openai-codex/gpt-6-luna:max"
      task: "openai-codex/gpt-6-luna:high"
      designer: "openai-codex/gpt-6-luna:high"
      advisor: "openai-codex/gpt-6-luna:medium"
      vision: "openai-codex/gpt-6-luna:medium"
      smol: "openai-codex/gpt-6-luna:off"
      commit: "openai-codex/gpt-6-luna:minimal"
      tiny: "openai-codex/gpt-6-luna:off"
  astra:
    modelRoles:
      default: "openai-codex/gpt-6-astra:low"
      plan: "openai-codex/gpt-6-astra:low"
      slow: "openai-codex/gpt-6-astra:low"
      task: "openai-codex/gpt-6-astra:low"
      designer: "openai-codex/gpt-6-astra:low"
      advisor: "openai-codex/gpt-6-astra:low"
      vision: "openai-codex/gpt-6-astra:low"
      smol: "openai-codex/gpt-6-astra:low"
      commit: "openai-codex/gpt-6-astra:low"
      tiny: "openai-codex/gpt-6-astra:low"
  sol:
    modelRoles:
      default: "openai-codex/gpt-6.1-sol:low"
      plan: "openai-codex/gpt-6.1-sol:low"
      slow: "openai-codex/gpt-6.1-sol:low"
      task: "openai-codex/gpt-6.1-sol:low"
      designer: "openai-codex/gpt-6.1-sol:low"
      advisor: "openai-codex/gpt-6.1-sol:low"
      vision: "openai-codex/gpt-6.1-sol:low"
      smol: "openai-codex/gpt-6.1-sol:low"
      commit: "openai-codex/gpt-6.1-sol:low"
      tiny: "openai-codex/gpt-6.1-sol:low"
  f2p:
    settings:
      tools:
        xdev: true
        xdevDocs: builtins
        xdevInlineDevices: []
      compaction:
        enabled: true
        autoContinue: false
      model:
        toolCallLoopGuard:
          enabled: true
          threshold: 2
    instructions: |
      Prefer read for static pages and the built-in browser helpers through eval for interactive pages.
      Read xd://eval/browser before using browser helpers; do not replace them with a custom CDP WebSocket script.
      Inspect the current page and report observed state before choosing an action.
      Do not repeat an action without new evidence that it will advance the task.
      If an attempt makes no progress, explain the blocker and stop rather than retrying with cosmetic changes.
      If raw CDP is genuinely necessary, match responses by request id, handle protocol errors,
      and read Runtime.evaluate values from response.result.result.value; an unrelated event or missing value is not proof of failure.
      Tool schemas remain available on demand: read xd:// to discover tools and read the selected device before invoking it.
    modelRoles:
      default: "lm-studio/qwen3.6-uncensored"
      plan: "lm-studio/qwen3.6-uncensored"
      slow: "lm-studio/qwen3.6-uncensored"
      task: "lm-studio/qwen3.6-uncensored"
      designer: "lm-studio/qwen3.6-uncensored"
      advisor: "lm-studio/qwen3.6-uncensored"
      vision: "lm-studio/qwen3.6-uncensored"
      smol: "lm-studio/qwen3.6-uncensored"
      commit: "lm-studio/qwen3.6-uncensored"
      tiny: "lm-studio/qwen3.6-uncensored"

